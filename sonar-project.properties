# SonarCloud project configuration.
# Create this project at https://sonarcloud.io first, then update the
# organization/projectKey below to match the values shown there.
sonar.organization=hinduino
sonar.projectKey=Hinduino_CareerConnect
sonar.projectName=CareerConnect

# Monorepo: analyze both the React client and the Express server.
sonar.sources=client/src,server/src
sonar.tests=client/src,server/src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.integration.test.js
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/*.test.js,**/*.test.jsx,**/*.integration.test.js
sonar.coverage.exclusions=**/*.test.js,**/*.test.jsx,**/*.integration.test.js,server/src/server.js,server/tests/**

# Test framework / coverage reports (produced by `npm run test:coverage`).
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,client/coverage/lcov.info

sonar.sourceEncoding=UTF-8
