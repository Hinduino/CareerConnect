name: Web App Testing Pipeline

on:
  push:
    branches: [ main ]
  pull_request:  
  
jobs:
  test-suite:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      # Stage 1: Dependency Installation and Linting
      # --- CLIENT PIPELINE ---
      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Run Client Lint
        working-directory: ./client
        run: npm run lint

      # --- SERVER PIPELINE ---
      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run Server Lint
        working-directory: ./server
        run: npm run lint

      # Stage 2: Unit Tests
      - name: Run Stage 2 (Unit Tests) For Client
        working-directory: ./client
        run: npm run test:unit

      - name: Run Stage 2 (Unit Tests) For Server
        working-directory: ./server
        run: npm run test:unit

      # Stage 3: Integration/API Testing
      - name: Run Stage 3 (Integration/API Tests) For Server
        working-directory: ./server
        run: npm run test:integration
        env:
          MONGO_URI: mongodb://localhost:27017/careerconnect

      # Stage 4: Code Coverage Analysis
      - name: Run Server Tests with Coverage
        working-directory: ./server
        run: npm run test:coverage
        env:
          MONGO_URI: mongodb://localhost:27017/careerconnect

      - name: Run Client Tests with Coverage
        working-directory: ./client
        run: npm run test:coverage

      - name: Generate Coverage Report
        working-directory: ./server
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## 📊 Code Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            node -e "const c=require('./coverage/coverage-summary.json').total;console.log('| Metric | Coverage |');console.log('|--------|----------|');console.log('| Lines | '+c.lines.pct.toFixed(2)+'% |');console.log('| Statements | '+c.statements.pct.toFixed(2)+'% |');console.log('| Functions | '+c.functions.pct.toFixed(2)+'% |');console.log('| Branches | '+c.branches.pct.toFixed(2)+'% |');" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Coverage file not found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check Coverage Threshold
        working-directory: ./server
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "❌ Coverage file not found"
            exit 1
          fi
          node -e "const c=require('./coverage/coverage-summary.json').total;const t=75;let f=false;console.log('\\n📊 Coverage Check Results:');console.log('================================');const m={'Lines':c.lines.pct,'Statements':c.statements.pct,'Functions':c.functions.pct,'Branches':c.branches.pct};Object.entries(m).forEach(([k,v])=>{const s=v>=t?'✅':'❌';console.log(s+' '+k+': '+v.toFixed(2)+'% (threshold: '+t+'%)');if(v<t)f=true;});console.log('================================\\n');if(f){console.error('Coverage below threshold!');process.exit(1);}else{console.log('All coverage checks passed!');}"

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
        if: always()
        with:
          files: ./server/coverage/lcov.info
          flags: server
          name: server-coverage
          fail_ci_if_error: false

      # Stage 5: Static Analysis (SonarCloud quality gate)
      # Requires a SONAR_TOKEN repo secret from the SonarCloud project settings.
      # Both steps are skipped automatically until that secret is configured.
      - name: SonarCloud Scan
        id: sonarcloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5

      # Fails the job (and therefore the PR check) if the SonarCloud quality
      # gate is not green, so a red quality gate blocks merging into main.
      - name: SonarCloud Quality Gate Check
        if: ${{ env.SONAR_TOKEN != '' && steps.sonarcloud.outcome == 'success' }}
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5

      # Stage 6: E2E Browser Testing (To be implemented)
      # - name: Install Playwright Browsers (For Stage 6)
      #   run: npx playwright install --with-deps

      # - name: Run Stage 6 (End-to-End Tests)
      #   run: npm run test:e2e
